name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download AI4I dataset
        run: |
          mkdir -p data
          curl -sL -o /tmp/ai4i.zip "https://archive.ics.uci.edu/static/public/601/ai4i+2020+predictive+maintenance+dataset.zip"
          unzip -o /tmp/ai4i.zip -d data

      - name: Lint
        run: ruff check src tests

      - name: Test with coverage
        run: pytest
