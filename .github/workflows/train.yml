name: Train and monitor

on:
  workflow_dispatch:
  schedule:
    # Weekly retrain + drift check, Mondays 03:00 UTC.
    - cron: "0 3 * * 1"

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download AI4I dataset
        run: |
          mkdir -p data
          curl -sL -o /tmp/ai4i.zip "https://archive.ics.uci.edu/static/public/601/ai4i+2020+predictive+maintenance+dataset.zip"
          unzip -o /tmp/ai4i.zip -d data

      - name: Train, gate on PR-AUC, and promote
        run: python -m src.pipeline

      - name: Generate drift report
        run: python -m src.monitoring.drift_report

      - name: Upload MLflow store and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-and-reports
          path: |
            mlflow.db
            mlartifacts/
            reports/drift_report.html
            reports/drift_summary.json
          if-no-files-found: warn
